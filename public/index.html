<!DOCTYPE html>
<html lang="es">
<head>

<link rel="manifest" href="/manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- TRUCO PARA MÓVILES: Forzamos 'only light' para que el celular NO aplique filtros de contraste/opacidad -->
    <meta name="color-scheme" content="only light">
    <!-- Pinta la barra superior del navegador/celular de negro para evitar franjas blancas -->
    <meta name="theme-color" content="#050608">
    
    <title>LEGADOS - Menú Principal</title>
    
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        :root { 
            --bg: #050608; --panel: rgba(26, 29, 36, 0.85); --text: #ecf0f1; 
            --gold: #f1c40f; --elo: #3498db; --humanos: #2980b9; 
            --magos: #8e44ad; --elfos: #27ae60; --coloso: #c0392b;
        }
        
        /* --- ESTILO DEL FONDO GLOBAL --- */
        * {
            -webkit-tap-highlight-color: transparent; 
        }

        html, body {
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            /* Usamos dvh (Dynamic Viewport) para que el celular calcule bien el alto sin cortar abajo */
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; 
        }

        body { 
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            box-sizing: border-box;
            position: relative;
        }

        /* FONDO REESTRUCTURADO: Evita el bug de la barra blanca en móviles */
        body::before {
            content: "";
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100dvh;
            background-image: url('fondoindex.jpg'); 
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            z-index: -1;
        }

        @media (min-width: 768px) {
            body::before { background-size: auto 100%; }
        }
        
        /* --- ESTILOS DE LA PANTALLA DE CARGA --- */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background-image: url('portada1.jpg'); background-size: cover; 
            background-position: center; background-repeat: no-repeat; 
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: flex-end; align-items: center;
            padding-bottom: 60px; transition: opacity 0.5s ease;
            background-color: var(--bg);
        }
        @media (min-width: 768px) { #loading-screen { background-size: contain; } }
        
        .loader-spinner { width: 45px; height: 45px; border: 5px solid rgba(255, 255, 255, 0.3); border-top: 5px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        .loader-text { margin-top: 15px; color: white; font-size: 1.2rem; font-weight: bold; text-shadow: 0px 2px 5px rgba(0,0,0,0.8); animation: pulse 1.5s infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .online-indicator { position: absolute; top: 10px; right: 15px; font-size: 0.8rem; color: #bdc3c7; display: flex; align-items: center; gap: 5px; text-shadow: 1px 1px 2px #000; }
        .dot { width: 8px; height: 8px; background-color: #2ecc71; border-radius: 50%; box-shadow: 0 0 5px #2ecc71; }

        #login-screen { margin-top: 30dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-google { background: #ea4335; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); transition: 0.2s; }
        .btn-google:hover { background: #c0392b; transform: scale(1.05); }

        /* --- CONTENEDOR PRINCIPAL --- */
        #main-screen { 
            display: none; 
            width: 100%; 
            max-width: 380px; 
            flex-direction: column; 
            align-items: center; 
            padding: 0 5px; 
            box-sizing: border-box;
            /* Ajustado levemente y usando dvh para que todo cuadre perfecto */
            margin-top: 15dvh; 
            margin-bottom: 2dvh;
        }

        /* --- CONTENEDOR INFO DEL JUGADOR CON CAPA JUGADOR --- */
        .player-status { 
            position: relative;
            width: 94%; 
            aspect-ratio: 1000 / 270; 
            background-image: url('capajugador.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-color: transparent;
            margin-bottom: 1.5dvh; 
            display: flex; 
            border: none;
            box-shadow: none;
            box-sizing: border-box; 
        }
        
        .player-info-content {
            position: absolute;
            left: 28%; 
            top: 25%;
            width: 65%;
            height: 50%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .player-name { 
            font-size: 1.1rem; 
            font-weight: bold; 
            color: #ebdca8; 
            text-shadow: 1px 1px 3px #000; 
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .stats-row { 
            display: flex; 
            gap: 20px; 
        }
        
        .stat-badge { 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            font-size: 1rem; 
            font-weight: bold; 
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        
        .stat-elo { color: var(--elo); }
        .stat-gold { color: var(--gold); }

        /* --- FACCIONES (CÍRCULOS Y TEXTOS) --- */
        .facciones-container { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 1.5dvh; 
            justify-content: center; 
        }
        
        .faccion-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .faccion-label {
            font-size: 0.55rem;
            color: #d1d1d1;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px #000;
        }

        .circulo-faccion { 
            width: 42px; 
            height: 42px; 
            border-radius: 50%; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.8); 
            transition: 0.3s; 
            background-size: cover; 
            background-position: center; 
            border: 2px solid; 
        }
        .faccion-humanos { background-image: url('caphumano.jpg'); border-color: var(--humanos); }
        .faccion-magos { background-image: url('capmago.jpg'); border-color: var(--magos); }
        .faccion-elfos { background-image: url('capelfo.jpg'); border-color: var(--elfos); }
        .faccion-coloso { background-image: url('capcoloso.jpg'); border-color: var(--coloso); }
        .bloqueada { filter: grayscale(100%) opacity(0.4); border: 2px dashed #666; box-shadow: none; }

        /* --- BOTONES PRINCIPALES (TODOS DEL MISMO TAMAÑO) --- */
        .menu-btn-img {
            width: 96%; 
            aspect-ratio: 800 / 170; 
            margin: 0.6dvh auto;
            border: none;
            background-color: transparent;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            display: block;
        }
        .menu-btn-img:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        /* Asignación de imágenes */
        .btn-online   { background-image: url('btn-online.png'); }
        .btn-historia { background-image: url('btn-historia.png'); }
        .btn-local    { background-image: url('btn-local.png'); }
        .btn-cpu      { background-image: url('btn-cpu.png'); }
        .btn-tienda   { background-image: url('btn-facciones.png'); }

        /* --- BOTONES INFERIORES (REGLAS Y CERRAR SESIÓN) --- */
        .bottom-buttons-container {
            display: flex;
            justify-content: space-between;
            width: 96%;
            gap: 15px;
            margin: 1.2dvh auto 0 auto;
        }

        .btn-bottom {
            flex: 1;
            aspect-ratio: 350 / 100; 
            border: none;
            background-color: transparent;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
        }

        .btn-bottom:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .btn-comojugar { background-image: url('btn-comojugar.png'); }
        .btn-cerrar    { background-image: url('btn-cerrar.png'); }

    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA INICIAL -->
    <div id="loading-screen">
        <div class="loader-spinner"></div>
        <div class="loader-text">Conectando al servidor...</div>
    </div>

    <div class="online-indicator">
        <div class="dot"></div> <span id="online-count">Cargando...</span>
    </div>


    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <p style="text-align: center; max-width: 300px; margin-bottom: 20px; color: #aaa;">Debes iniciar sesión para guardar tu progreso, ELO y Monedas.</p>
        <button class="btn-google" onclick="iniciarSesion()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
            Entrar con Google
        </button>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="main-screen">
        
        <!-- ESTADO DEL JUGADOR (CAPA JUGADOR) -->
        <div class="player-status">
            <div class="player-info-content">
                <div class="player-name" id="ui-nombre">Cargando...</div>
                <div class="stats-row">
                    <div class="stat-badge stat-elo">🏆 <span id="ui-elo">--</span></div>
                    <div class="stat-badge stat-gold">🪙 <span id="ui-oro">--</span></div>
                </div>
            </div>
        </div>

        <!-- FACCIONES EN EL MEDIO -->
        <div class="facciones-container">
            <div class="faccion-wrapper">
                <div id="fac-humanos" class="circulo-faccion faccion-humanos bloqueada" title="Humanos"></div>
                <span class="faccion-label">HUMANOS</span>
            </div>
            <div class="faccion-wrapper">
                <div id="fac-magos" class="circulo-faccion faccion-magos bloqueada" title="Magos"></div>
                <span class="faccion-label">MAGOS</span>
            </div>
            <div class="faccion-wrapper">
                <div id="fac-elfos" class="circulo-faccion faccion-elfos bloqueada" title="Elfos"></div>
                <span class="faccion-label">ELFOS</span>
            </div>
            <div class="faccion-wrapper">
                <div id="fac-coloso" class="circulo-faccion faccion-coloso bloqueada" title="Coloso"></div>
                <span class="faccion-label">COLOSO</span>
            </div>
        </div>

        <!-- BOTONES PRINCIPALES EN PILA -->
        <button class="menu-btn-img btn-online" aria-label="Jugar Online" onclick="irA('seleccion_multi.html', 'online')"></button>
        <button class="menu-btn-img btn-historia" aria-label="Modo Historia" onclick="irA('seleccion_historia.html', 'historia')"></button>
        <button class="menu-btn-img btn-local" aria-label="1VS1 Local" onclick="irA('seleccion_1vs1.html', '1vs1')"></button>
        <button class="menu-btn-img btn-cpu" aria-label="Entrenamiento" onclick="irA('seleccion_cpu.html', 'cpu')"></button>
        <button class="menu-btn-img btn-tienda" aria-label="Tienda" onclick="irA('galeria.html')"></button>

        <!-- BOTONES INFERIORES: REGLAS Y CERRAR SESIÓN -->
        <div class="bottom-buttons-container">
            <button class="btn-bottom btn-comojugar" aria-label="Reglas" onclick="irA('reglas.html')"></button>
            <button class="btn-bottom btn-cerrar" aria-label="Cerrar Sesión" onclick="cerrarSesion()"></button>
        </div>

    </div>

    <script>
        window.estadoJugador = { id: null, nombre: 'Jugador', monedas: 0, elo: 1000, facciones_desbloqueadas: [], personajes_comprados: [] };

        function iniciarContadorOnline() {
            const channel = window.clienteSupabase.channel('sala-global-online');

            channel
                .on('presence', { event: 'sync' }, () => {
                    const state = channel.presenceState();
                    const totalConectados = Object.keys(state).length;
                    
                    const contadorEl = document.getElementById('online-count');
                    if (contadorEl) {
                        contadorEl.innerText = `${totalConectados} Conectado${totalConectados === 1 ? '' : 's'}`;
                    }
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await channel.track({ 
                            conectado_en: new Date().toISOString(),
                            usuario: window.estadoJugador?.nombre || 'Anónimo'
                        });
                    }
                });
        }

        async function iniciarSesion() {
            const { data, error } = await window.clienteSupabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + window.location.pathname }
            });
            if (error) alert("Error al iniciar sesión: " + error.message);
        }

        async function cerrarSesion() {
            await window.clienteSupabase.auth.signOut();
            localStorage.removeItem('legados_estado');
            window.location.reload();
        }

        async function verificarSesion() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'none';

            const { data: { session } } = await window.clienteSupabase.auth.getSession();

            if (session) {
                const { data: perfil, error } = await window.clienteSupabase
                    .from('perfiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();

                if (perfil) {
                    window.estadoJugador = perfil;
                    localStorage.setItem('legados_estado', JSON.stringify(perfil));
                    actualizarInterfaz(perfil);
                    document.getElementById('main-screen').style.display = 'flex';
                }
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        }

        function actualizarInterfaz(perfil) {
            document.getElementById('ui-nombre').innerText = perfil.nombre;
            document.getElementById('ui-elo').innerText = perfil.elo;
            document.getElementById('ui-oro').innerText = perfil.monedas;

            const facciones = perfil.facciones_facciones_desbloqueadas || perfil.facciones_desbloqueadas || [];
            if (facciones.includes('humanos')) document.getElementById('fac-humanos').classList.remove('bloqueada');
            if (facciones.includes('magos')) document.getElementById('fac-magos').classList.remove('bloqueada');
            if (facciones.includes('elfos')) document.getElementById('fac-elfos').classList.remove('bloqueada');
            if (facciones.includes('coloso')) document.getElementById('fac-coloso').classList.remove('bloqueada');
        }

        function irA(url, modo) {
            if (modo) {
                localStorage.setItem('modoJuego', modo);
            } else {
                localStorage.removeItem('modoJuego');
            }
            window.location.href = url;
        }

        window.onload = () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    verificarSesion();
                    iniciarContadorOnline();
                }, 500); 
                
            }, 3000);
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => { console.log('Service Worker registrado con éxito:', reg.scope); })
                    .catch((err) => { console.log('Error al registrar el Service Worker:', err); });
            });
        }

    </script>
</body>
</html>
