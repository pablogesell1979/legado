<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGADOS - Menú Principal</title>
    
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        :root { 
            --bg: #0b0c10; --panel: #1a1d24; --text: #c5c6c7; 
            --gold: #f1c40f; --elo: #3498db; --humanos: #2980b9; 
            --magos: #8e44ad; --elfos: #27ae60; --coloso: #c0392b;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; position: relative; }
        
        /* --- ESTILOS DE LA PANTALLA DE CARGA --- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('portada1.jpg');
            background-size: cover; /* Por defecto en celus llena la pantalla */
            background-position: center;
            background-repeat: no-repeat; /* Evita que la imagen se duplique en PC */
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 60px;
            transition: opacity 0.5s ease;
            background-color: var(--bg); /* Color de fondo a los costados en PC */
        }

        /* Detecta si es una pantalla de PC o Tablet horizontal y ajusta a lo alto */
        @media (min-width: 768px) {
            #loading-screen {
                background-size: contain; 
            }
        }
        
        .loader-spinner {
            width: 45px;
            height: 45px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            margin-top: 15px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0px 2px 5px rgba(0,0,0,0.8);
            animation: pulse 1.5s infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        /* --------------------------------------- */

        .online-indicator { position: absolute; top: 10px; right: 15px; font-size: 0.8rem; color: #7f8c8d; display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background-color: #2ecc71; border-radius: 50%; box-shadow: 0 0 5px #2ecc71; }

        .logo-img { width: 90%; max-width: 350px; margin: 40px 0 20px 0; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; }
        .btn-google { background: #ea4335; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
        .btn-google:hover { background: #c0392b; }

        #main-screen { display: none; width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }

        .player-status { background: var(--panel); width: 100%; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
        .player-name { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .stats-row { display: flex; gap: 20px; }
        .stat-badge { display: flex; align-items: center; gap: 5px; font-size: 1.2rem; font-weight: bold; background: #000; padding: 5px 15px; border-radius: 20px; border: 1px solid #333; }
        .stat-elo { color: var(--elo); }
        .stat-gold { color: var(--gold); }

        .facciones-container { display: flex; gap: 15px; margin-bottom: 25px; }
        .circulo-faccion { 
            width: 55px; 
            height: 55px; 
            border-radius: 50%; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); 
            transition: 0.3s; 
            background-size: cover; 
            background-position: center;
            border: 3px solid; 
        }
        
        .faccion-humanos { background-image: url('caphumano.jpg'); border-color: var(--humanos); }
        .faccion-magos { background-image: url('capmago.jpg'); border-color: var(--magos); }
        .faccion-elfos { background-image: url('capelfo.jpg'); border-color: var(--elfos); }
        .faccion-coloso { background-image: url('capcoloso.jpg'); border-color: var(--coloso); }
        
        .bloqueada { filter: grayscale(100%) opacity(0.4); border: 2px dashed #666; box-shadow: none; }

        .menu-btn { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; background: #2c3e50; color: white; }
        .menu-btn:hover { background: #34495e; }
        
        .btn-destacado { transform: scale(1.02); margin: 10px 0; border: 2px solid; }
        .btn-historia { background: #8e44ad; border-color: #9b59b6; }
        .btn-historia:hover { background: #9b59b6; }
        .btn-online { background: #d35400; border-color: #e67e22; }
        .btn-online:hover { background: #e67e22; }
        .btn-tienda { background: #27ae60; }
        .btn-tienda:hover { background: #2ecc71; }

        .reward { font-size: 0.9rem; color: var(--gold); background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 10px; display: flex; align-items: center; gap: 4px; }
        .btn-logout { margin-top: 20px; background: transparent; border: 1px solid #c0392b; color: #c0392b; padding: 5px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA INICIAL -->
    <div id="loading-screen">
        <div class="loader-spinner"></div>
        <div class="loader-text">Conectando al servidor...</div>
    </div>

    <div class="online-indicator">
        <div class="dot"></div> <span id="online-count">12 Conectados</span>
    </div>

    <img src="LogoSolo.png" alt="Logo Legados" class="logo-img">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <p style="text-align: center; max-width: 300px; margin-bottom: 20px; color: #888;">Debes iniciar sesión para guardar tu progreso, ELO y Monedas.</p>
        <button class="btn-google" onclick="iniciarSesion()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
            Entrar con Google
        </button>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="main-screen">
        <div class="player-status">
            <div class="player-name" id="ui-nombre">Cargando...</div>
            <div class="stats-row">
                <div class="stat-badge stat-elo">🏆 <span id="ui-elo">--</span></div>
                <div class="stat-badge stat-gold">🪙 <span id="ui-oro">--</span></div>
            </div>
        </div>

        <div class="facciones-container">
            <div id="fac-humanos" class="circulo-faccion faccion-humanos bloqueada" title="Humanos"></div>
            <div id="fac-magos" class="circulo-faccion faccion-magos bloqueada" title="Magos"></div>
            <div id="fac-elfos" class="circulo-faccion faccion-elfos bloqueada" title="Elfos"></div>
            <div id="fac-coloso" class="circulo-faccion faccion-coloso bloqueada" title="Coloso"></div>
        </div>

        <button class="menu-btn btn-tienda" onclick="irA('galeria.html')">
            <span>🛒 Conseguir Facciones</span>
        </button>

        <button class="menu-btn btn-destacado btn-historia" onclick="irA('seleccion_historia.html', 'historia')">
            <span>📖 Modo Historia</span>
            <div class="reward">🪙 +10</div>
        </button>

        <button class="menu-btn btn-destacado btn-online" onclick="irA('seleccion_multi.html', 'online')">
            <span>🌐 Jugar Online</span>
            <div class="reward">🪙 +25</div>
        </button>

        <button class="menu-btn" onclick="irA('seleccion_1vs1.html', '1vs1')">
            <span>⚔️ 1vs1 Local</span>
        </button>

        <button class="menu-btn" onclick="irA('seleccion_cpu.html', 'cpu')">
            <span>🤖 Entrenamiento Vs CPU</span>
            <div class="reward">🪙 +5</div>
        </button>

        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <script>
        window.estadoJugador = { id: null, nombre: 'Jugador', monedas: 0, elo: 1000, facciones_desbloqueadas: [], personajes_comprados: [] };

// --- FUNCIÓN NUEVA PARA CONTAR CONECTADOS ---
        function iniciarContadorOnline() {
            const channel = window.clienteSupabase.channel('sala-global-online');

            channel
                .on('presence', { event: 'sync' }, () => {
                    const state = channel.presenceState();
                    const totalConectados = Object.keys(state).length;
                    
                    const contadorEl = document.getElementById('online-count');
                    if (contadorEl) {
                        contadorEl.innerText = `${totalConectados} Conectado${totalConectados === 1 ? '' : 's'}`;
                    }
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await channel.track({ 
                            conectado_en: new Date().toISOString(),
                            usuario: window.estadoJugador?.nombre || 'Anónimo'
                        });
                    }
                });
        }
// ---------------------------------------------

        async function iniciarSesion() {
            const { data, error } = await window.clienteSupabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + window.location.pathname }
            });
            if (error) alert("Error al iniciar sesión: " + error.message);
        }

        async function cerrarSesion() {
            await window.clienteSupabase.auth.signOut();
            localStorage.removeItem('legados_estado');
            window.location.reload();
        }

        async function verificarSesion() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'none';

            const { data: { session } } = await window.clienteSupabase.auth.getSession();

            if (session) {
                const { data: perfil, error } = await window.clienteSupabase
                    .from('perfiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();

                if (perfil) {
                    window.estadoJugador = perfil;
                    localStorage.setItem('legados_estado', JSON.stringify(perfil));
                    actualizarInterfaz(perfil);
                    document.getElementById('main-screen').style.display = 'flex';
                }
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        }

        function actualizarInterfaz(perfil) {
            document.getElementById('ui-nombre').innerText = perfil.nombre;
            document.getElementById('ui-elo').innerText = perfil.elo;
            document.getElementById('ui-oro').innerText = perfil.monedas;

            const facciones = perfil.facciones_facciones_desbloqueadas || perfil.facciones_desbloqueadas || [];
            if (facciones.includes('humanos')) document.getElementById('fac-humanos').classList.remove('bloqueada');
            if (facciones.includes('magos')) document.getElementById('fac-magos').classList.remove('bloqueada');
            if (facciones.includes('elfos')) document.getElementById('fac-elfos').classList.remove('bloqueada');
            if (facciones.includes('coloso')) document.getElementById('fac-coloso').classList.remove('bloqueada');
        }

        function irA(url, modo) {
            if (modo) {
                localStorage.setItem('modoJuego', modo);
            } else {
                localStorage.removeItem('modoJuego');
            }
            window.location.href = url;
        }

        window.onload = () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    verificarSesion();
                }, 500); 
                
            }, 3000);
        };
    </script>
</body>
</html>
