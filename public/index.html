<!DOCTYPE html>
<html lang="es">
<head>

<link rel="manifest" href="/manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEGADOS - Menú Principal</title>
    
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        :root { 
            --bg: #050608; --panel: rgba(26, 29, 36, 0.85); --text: #ecf0f1; 
            --gold: #f1c40f; --elo: #3498db; --humanos: #2980b9; 
            --magos: #8e44ad; --elfos: #27ae60; --coloso: #c0392b;
        }
        
        /* --- ESTILO DEL FONDO GLOBAL --- */
        body { 
            background-color: var(--bg);
            background-image: url('fondoindex.jpg'); 
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px 10px; 
            box-sizing: border-box;
            overflow-x: hidden; 
        }

        @media (min-width: 768px) {
            body { background-size: auto 100%; }
        }
        
        /* --- ESTILOS DE LA PANTALLA DE CARGA --- */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('portada1.jpg'); background-size: cover; 
            background-position: center; background-repeat: no-repeat; 
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: flex-end; align-items: center;
            padding-bottom: 60px; transition: opacity 0.5s ease;
            background-color: var(--bg);
        }
        @media (min-width: 768px) { #loading-screen { background-size: contain; } }
        
        .loader-spinner { width: 45px; height: 45px; border: 5px solid rgba(255, 255, 255, 0.3); border-top: 5px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        .loader-text { margin-top: 15px; color: white; font-size: 1.2rem; font-weight: bold; text-shadow: 0px 2px 5px rgba(0,0,0,0.8); animation: pulse 1.5s infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .online-indicator { position: absolute; top: 10px; right: 15px; font-size: 0.8rem; color: #bdc3c7; display: flex; align-items: center; gap: 5px; text-shadow: 1px 1px 2px #000; }
        .dot { width: 8px; height: 8px; background-color: #2ecc71; border-radius: 50%; box-shadow: 0 0 5px #2ecc71; }

        .logo-img { width: 80%; max-width: 280px; margin: 0 0 15px 0; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }

        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; }
        .btn-google { background: #ea4335; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); transition: 0.2s; }
        .btn-google:hover { background: #c0392b; transform: scale(1.05); }

        #main-screen { display: none; width: 100%; max-width: 450px; flex-direction: column; align-items: center; padding: 5px; box-sizing: border-box; }

        .player-status { background: var(--panel); width: 94%; padding: 12px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; }
        .player-name { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; color: #fff; text-shadow: 1px 1px 3px #000; }
        .stats-row { display: flex; gap: 20px; }
        .stat-badge { display: flex; align-items: center; gap: 5px; font-size: 1.1rem; font-weight: bold; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; border: 1px solid #444; }
        .stat-elo { color: var(--elo); }
        .stat-gold { color: var(--gold); }

        .facciones-container { display: flex; gap: 15px; margin-bottom: 15px; }
        .circulo-faccion { width: 50px; height: 50px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.8); transition: 0.3s; background-size: cover; background-position: center; border: 3px solid; }
        .faccion-humanos { background-image: url('caphumano.jpg'); border-color: var(--humanos); }
        .faccion-magos { background-image: url('capmago.jpg'); border-color: var(--magos); }
        .faccion-elfos { background-image: url('capelfo.jpg'); border-color: var(--elfos); }
        .faccion-coloso { background-image: url('capcoloso.jpg'); border-color: var(--coloso); }
        .bloqueada { filter: grayscale(100%) opacity(0.4); border: 2px dashed #666; box-shadow: none; }

        /* --- BOTONES PRINCIPALES --- */
        .menu-btn-img {
            width: 94%; 
            margin: 6px auto;
            border: none;
            background-color: transparent;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), -1px -1px 2px rgba(0,0,0,0.8);
            transition: transform 0.2s, filter 0.2s;
        }
        .menu-btn-img:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .btn-tienda { background-image: url('btn-facciones.png'); height: 75px; }
        .btn-historia { background-image: url('btn-historia.png'); height: 90px; font-size: 1.25rem; }
        .btn-online { background-image: url('btn-online.png'); height: 90px; font-size: 1.35rem; }
        .btn-comojugar { background-image: url('btn-comojugar.png'); height: 75px; margin-top: 5px; }

        .btn-content {
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%; 
            padding: 0 10%;
            box-sizing: border-box;
        }
        
        .btn-content.center { justify-content: center; gap: 15px; }
        .btn-content.space-between { justify-content: space-between; }

        /* --- BOTONES DIVIDIDOS (1vs1 y CPU) --- */
        .split-buttons-container {
            display: flex;
            justify-content: space-between;
            width: 94%; /* Mismo ancho que los demás botones */
            gap: 10px;
            margin: 6px auto;
        }

        .btn-half {
            flex: 1;
            height: 70px;
            border: none;
            background-color: transparent;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), -1px -1px 2px rgba(0,0,0,0.8);
            transition: transform 0.2s, filter 0.2s;
            padding: 0;
        }

        .btn-half:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .btn-local { background-image: url('btn-local.png'); }
        .btn-cpu { background-image: url('btn-cpu.png'); }

        .half-btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            /* El padding izquierdo empuja el texto para que no pise los íconos impresos en el PNG */
            padding-left: 28px; 
            box-sizing: border-box;
        }

        .reward { font-size: 0.9rem; color: var(--gold); background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 12px; display: flex; align-items: center; gap: 4px; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
        
        .btn-logout { margin-top: 20px; background: rgba(0,0,0,0.5); border: 1px solid #c0392b; color: #ff7675; padding: 8px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-logout:hover { background: #c0392b; color: white; }
    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA INICIAL -->
    <div id="loading-screen">
        <div class="loader-spinner"></div>
        <div class="loader-text">Conectando al servidor...</div>
    </div>

    <div class="online-indicator">
        <div class="dot"></div> <span id="online-count">Cargando...</span>
    </div>

    <img src="LogoSolo.png" alt="Logo Legados" class="logo-img">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <p style="text-align: center; max-width: 300px; margin-bottom: 20px; color: #aaa;">Debes iniciar sesión para guardar tu progreso, ELO y Monedas.</p>
        <button class="btn-google" onclick="iniciarSesion()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
            Entrar con Google
        </button>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="main-screen">
        <div class="player-status">
            <div class="player-name" id="ui-nombre">Cargando...</div>
            <div class="stats-row">
                <div class="stat-badge stat-elo">🏆 <span id="ui-elo">--</span></div>
                <div class="stat-badge stat-gold">🪙 <span id="ui-oro">--</span></div>
            </div>
        </div>

        <div class="facciones-container">
            <div id="fac-humanos" class="circulo-faccion faccion-humanos bloqueada" title="Humanos"></div>
            <div id="fac-magos" class="circulo-faccion faccion-magos bloqueada" title="Magos"></div>
            <div id="fac-elfos" class="circulo-faccion faccion-elfos bloqueada" title="Elfos"></div>
            <div id="fac-coloso" class="circulo-faccion faccion-coloso bloqueada" title="Coloso"></div>
        </div>

        <button class="menu-btn-img btn-tienda" onclick="irA('galeria.html')">
            <div class="btn-content center">
                <span>Conseguir Facciones</span>
            </div>
        </button>

        <button class="menu-btn-img btn-historia" onclick="irA('seleccion_historia.html', 'historia')">
            <div class="btn-content space-between">
                <span>Modo Historia</span>
                <div class="reward">🪙 +10</div>
            </div>
        </button>

        <button class="menu-btn-img btn-online" onclick="irA('seleccion_multi.html', 'online')">
            <div class="btn-content center">
                <span>Jugar Online</span>
                <div class="reward">🪙 +25</div>
            </div>
        </button>

        <!-- CONTENEDOR DE BOTONES SEPARADOS: 1vs1 y CPU -->
        <div class="split-buttons-container">
            
            <button class="btn-half btn-local" onclick="irA('seleccion_1vs1.html', '1vs1')">
                <div class="half-btn-content">
                    <span style="font-size: 1rem;">1vs1 Local</span>
                </div>
            </button>
            
            <button class="btn-half btn-cpu" onclick="irA('seleccion_cpu.html', 'cpu')">
                <div class="half-btn-content" style="flex-direction: column; gap: 4px;">
                    <span style="font-size: 0.85rem;">Entrenamiento</span>
                    <div class="reward" style="font-size: 0.75rem; padding: 2px 6px;">🪙 +5</div>
                </div>
            </button>
            
        </div>

        <button class="menu-btn-img btn-comojugar" onclick="irA('reglas.html')">
            <div class="btn-content center">
                <span>Cómo Jugar</span>
            </div>
        </button>

        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <script>
        window.estadoJugador = { id: null, nombre: 'Jugador', monedas: 0, elo: 1000, facciones_desbloqueadas: [], personajes_comprados: [] };

        function iniciarContadorOnline() {
            const channel = window.clienteSupabase.channel('sala-global-online');

            channel
                .on('presence', { event: 'sync' }, () => {
                    const state = channel.presenceState();
                    const totalConectados = Object.keys(state).length;
                    
                    const contadorEl = document.getElementById('online-count');
                    if (contadorEl) {
                        contadorEl.innerText = `${totalConectados} Conectado${totalConectados === 1 ? '' : 's'}`;
                    }
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await channel.track({ 
                            conectado_en: new Date().toISOString(),
                            usuario: window.estadoJugador?.nombre || 'Anónimo'
                        });
                    }
                });
        }

        async function iniciarSesion() {
            const { data, error } = await window.clienteSupabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + window.location.pathname }
            });
            if (error) alert("Error al iniciar sesión: " + error.message);
        }

        async function cerrarSesion() {
            await window.clienteSupabase.auth.signOut();
            localStorage.removeItem('legados_estado');
            window.location.reload();
        }

        async function verificarSesion() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'none';

            const { data: { session } } = await window.clienteSupabase.auth.getSession();

            if (session) {
                const { data: perfil, error } = await window.clienteSupabase
                    .from('perfiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();

                if (perfil) {
                    window.estadoJugador = perfil;
                    localStorage.setItem('legados_estado', JSON.stringify(perfil));
                    actualizarInterfaz(perfil);
                    document.getElementById('main-screen').style.display = 'flex';
                }
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        }

        function actualizarInterfaz(perfil) {
            document.getElementById('ui-nombre').innerText = perfil.nombre;
            document.getElementById('ui-elo').innerText = perfil.elo;
            document.getElementById('ui-oro').innerText = perfil.monedas;

            const facciones = perfil.facciones_facciones_desbloqueadas || perfil.facciones_desbloqueadas || [];
            if (facciones.includes('humanos')) document.getElementById('fac-humanos').classList.remove('bloqueada');
            if (facciones.includes('magos')) document.getElementById('fac-magos').classList.remove('bloqueada');
            if (facciones.includes('elfos')) document.getElementById('fac-elfos').classList.remove('bloqueada');
            if (facciones.includes('coloso')) document.getElementById('fac-coloso').classList.remove('bloqueada');
        }

        function irA(url, modo) {
            if (modo) {
                localStorage.setItem('modoJuego', modo);
            } else {
                localStorage.removeItem('modoJuego');
            }
            window.location.href = url;
        }

        window.onload = () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    verificarSesion();
                    iniciarContadorOnline();
                }, 500); 
                
            }, 3000);
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => { console.log('Service Worker registrado con éxito:', reg.scope); })
                    .catch((err) => { console.log('Error al registrar el Service Worker:', err); });
            });
        }

    </script>
</body>
</html>
