<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado - Modo Historia - Legados</title>
    
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #0b0c10 radial-gradient(circle at center, #1f132b 0%, #0b0c10 100%);
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; text-align: center;
        }
        
        .contenedor {
            background-color: #15131c; 
            padding: 25px; 
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(142, 68, 173, 0.35); 
            border: 2px solid #8e44ad;
            text-align: center; 
            width: 100%; 
            max-width: 450px; 
            position: relative; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo { 
            width: 100%; max-width: 220px; height: auto; margin-bottom: 15px; 
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
        }
        
        .titulo-resultado {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 6vw, 2.8rem);
            margin: 5px 0 10px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .victoria { color: #2ecc71; text-shadow: 0 0 15px rgba(46, 204, 113, 0.4); }
        .derrota { color: #e74c3c; text-shadow: 0 0 15px rgba(231, 76, 60, 0.4); }

        .banner-escenario {
            width: 100%; background: linear-gradient(135deg, #2c163b 0%, #150d1f 100%);
            border: 2px solid #f1c40f; border-radius: 10px; padding: 12px; margin-bottom: 15px;
            box-shadow: inset 0 0 15px rgba(241, 196, 15, 0.2);
        }

        .subtitulo-nivel {
            font-family: 'Cinzel', serif; font-size: 0.95rem; color: #f1c40f; font-weight: 700; margin-bottom: 2px;
        }

        .nombre-escenario {
            font-size: 1.05rem; color: #ffffff; font-style: italic; font-family: 'Cinzel', serif;
        }

        .recompensa-box {
            background: #1a1d24; border: 2px solid #8e44ad; border-radius: 10px;
            padding: 12px 15px; margin-bottom: 25px; font-size: 1rem; font-weight: bold;
            color: #f1c40f; box-shadow: 0 0 15px rgba(142, 68, 173, 0.2); width: 100%;
        }

        .botones { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        .btn {
            padding: 14px; font-size: 1.1rem; border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; transition: all 0.2s; text-decoration: none;
            display: inline-block; font-family: 'Cinzel', serif; letter-spacing: 1px;
        }
        
        .btn-continuar { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); color: white; border: 1px solid #f1c40f; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); }
        .btn-continuar:hover { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); transform: translateY(-2px); }

        .btn-reintentar { background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%); color: white; border: 1px solid #f1c40f; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
        .btn-reintentar:hover { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); transform: translateY(-2px); }

        .btn-menu { background: transparent; border: 1px solid #7f8c8d; color: #95a5a6; padding: 10px; font-size: 0.95rem; }
        .btn-menu:hover { color: white; border-color: white; }

        @media (max-width: 480px) {
            body { padding: 10px; } .contenedor { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <img src="Legado_logo.png" alt="Legado Asymmetric Chess" class="logo" onerror="this.src='LogoSolo.png'">
        
        <h1 id="titulo-estado" class="titulo-resultado">PROCESANDO...</h1>
        
        <div class="banner-escenario">
            <div class="subtitulo-nivel" id="lbl-info-nivel">NIVEL X - CONCRETADO</div>
            <div class="nombre-escenario" id="lbl-nombre-escenario">Cargando...</div>
        </div>
        
        <div class="recompensa-box" id="texto-recompensa">Sincronizando progreso...</div>

        <div class="botones" id="contenedor-botones">
            <!-- Los botones se generan dinámicamente según si ganó o perdió -->
        </div>
    </div>

    <script>
        // Diccionario idéntico de los 20 escenarios del Modo Historia
        const nombresEscenarios = {
            1: "El Despertar en el Claro",
            2: "Los Primeros Pasos del Aprendiz",
            3: "El Cruce del Arroyo Manso",
            4: "La Entrada al Bosque Susurrante",
            5: "Sendero de las Hojas Ancestrales",
            6: "El Refugio de los Sabios",
            7: "La Encrucijada de Frontera",
            8: "Camino a las Colinas Empedradas",
            9: "Las Puertas del Arrabal",
            10: "Plaza del Mercado: Voces de Alerta",
            11: "El Asedio a la Guarnición",
            12: "La Torre de los Ecos Ocultos",
            13: "Cámaras de Cristal y Polvo Estelar",
            14: "El Laboratorio del Hechicero Errante",
            15: "Convergencia de Líneas Ley",
            16: "La Caverna de las Sombras Vivas",
            17: "Páramo de Cenizas Frías",
            18: "El Abismo de los Susurros",
            19: "Umbral del Trono Prohibido",
            20: "El Núcleo del Cataclismo"
        };

        window.onload = async function() {
            // Recibimos los datos que pasará el tablero de historia
            const datosGuardados = localStorage.getItem('resultadoPartida');
            
            // Leemos el estado unificado de legados_estado
            const estadoLegado = JSON.parse(localStorage.getItem('legados_estado') || '{}');
            
            let nivelJugado = 1;
            let ganoPartida = false;

            if (datosGuardados) {
                const datos = JSON.parse(datosGuardados);
                nivelJugado = parseInt(datos.nivelHistoria || estadoLegado.nivel_historia || '1');
                ganoPartida = (datos.ganador === 1);
            } else {
                nivelJugado = parseInt(estadoLegado.nivel_historia || '1');
                ganoPartida = true;
            }

            // Textos de escenario
            const nombreEsc = nombresEscenarios[nivelJugado] || "Batalla Épica";
            document.getElementById('lbl-nombre-escenario').innerText = `"${nombreEsc}"`;

            const tituloEl = document.getElementById('titulo-estado');
            const infoNivelEl = document.getElementById('lbl-info-nivel');
            const recompensaEl = document.getElementById('texto-recompensa');
            const botonesEl = document.getElementById('contenedor-botones');

            let nuevoNivelHistorial = nivelJugado;

            if (ganoPartida) {
                // VICTORIA EN HISTORIA
                tituloEl.innerText = "¡VICTORIA!";
                tituloEl.className = "titulo-resultado victoria";
                infoNivelEl.innerText = `NIVEL ${nivelJugado} - CONCRETADO`;
                recompensaEl.innerHTML = "📖 ¡Nivel superado con éxito! +10 🪙<br>Progreso guardado en el reino.";
                
                // Avanzar nivel (tope 20+1 final)
                if (nivelJugado <= 20) {
                    nuevoNivelHistorial = nivelJugado + 1;
                }

                botonesEl.innerHTML = `
                    <a href="seleccion_historia.html" class="btn btn-continuar">Siguiente Nivel ➡</a>
                    <a href="index.html" class="btn btn-menu">Volver al Menú Principal</a>
                `;
            } else {
                // DERROTA EN HISTORIA
                tituloEl.innerText = "DERROTA";
                tituloEl.className = "titulo-resultado derrota";
                infoNivelEl.innerText = `NIVEL ${nivelJugado} - DERROTADO`;
                recompensaEl.innerHTML = "⚔️ Tus tropas han caído ante la adversidad.<br>Debes mejorar tu estrategia para avanzar.";
                
                // El nivel no cambia si pierde
                nuevoNivelHistorial = nivelJugado;

                botonesEl.innerHTML = `
                    <a href="seleccion_historia.html" class="btn btn-reintentar">🔄 Reintentar / Volver al Mapa</a>
                    <a href="index.html" class="btn btn-menu">Volver al Menú Principal</a>
                `;
            }

            // Sincronización con Supabase (y respaldo en localStorage local)
            try {
                // Guardar localmente temporalmente por seguridad
                let estadoLocal = JSON.parse(localStorage.getItem('legados_estado') || '{}');
                estadoLocal.nivel_historia = nuevoNivelHistorial;
                localStorage.setItem('legados_estado', JSON.stringify(estadoLocal));

                if (window.clienteSupabase) {
                    const { data: { session } } = await window.clienteSupabase.auth.getSession();
                    
                    if (session) {
                        const { data: perfil } = await window.clienteSupabase
                            .from('perfiles')
                            .select('*')
                            .eq('id', session.user.id)
                            .single();

                        if (perfil) {
                            let monedasActuales = perfil.monedas || 0;
                            let datosUpdate = {};

                            if (ganoPartida) {
                                monedasActuales += 10;
                                datosUpdate.monedas = monedasActuales;
                                
                                // Si el nivel superado es mayor o igual al que tenía registrado, lo actualizamos
                                const nivelActualDB = perfil.nivel_historia || 1;
                                if (nuevoNivelHistorial > nivelActualDB) {
                                    datosUpdate.nivel_historia = nuevoNivelHistorial;
                                }
                            }

                            await window.clienteSupabase
                                .from('perfiles')
                                .update(datosUpdate)
                                .eq('id', session.user.id);
                        }
                    }
                }
            } catch (err) {
                console.error("Error al actualizar Supabase en historia:", err);
            } finally {
                // Limpieza de rastros de la partida actual
                localStorage.removeItem('resultadoPartida');
                localStorage.removeItem('modoJuego');
            }
        };
    </script>
</body>
</html>
