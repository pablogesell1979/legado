<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Fin de Partida! - Legado Asimétrico</title>
    
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0c10; color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; text-align: center;
            background-image: radial-gradient(circle at center, #1a1d24 0%, #0b0c10 100%);
        }
        
        .logo { max-width: 80%; width: 300px; margin-bottom: 10px; height: auto; }
        
        .titulo-victoria {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: #c5a059;
            text-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .subtitulo {
            font-size: clamp(1.2rem, 4vw, 1.5rem); 
            color: #f39c12; margin-bottom: 10px;
            padding: 0 10px;
        }

        .recompensa-box {
            background: #1a1d24; border: 2px solid #f1c40f; border-radius: 10px;
            padding: 12px 20px; margin-bottom: 20px; font-size: 1.1rem; font-weight: bold;
            color: #f1c40f; box-shadow: 0 0 15px rgba(241, 196, 15, 0.2);
        }

        .contenedor-imagen {
            width: 90%; 
            max-width: 350px;
            aspect-ratio: 1 / 1;
            background-color: #0b0c10;
            border: 3px solid #c5a059; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(197, 160, 89, 0.3);
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            margin-bottom: 30px;
        }
        .contenedor-imagen img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .botones { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        
        .btn {
            padding: 15px 30px; font-size: 1.1rem; border: none; border-radius: 6px;
            cursor: pointer; font-weight: bold; transition: all 0.2s; text-decoration: none;
            display: inline-block;
        }
        .btn-menu { background-color: #3498db; color: white; }
        .btn-menu:hover { background-color: #2980b9; transform: scale(1.05); }
    </style>
</head>
<body>

    <img src="LogoSolo.png" alt="Legado Asymmetric Chess" class="logo">
    
    <h1 class="titulo-victoria">¡FIN DE PARTIDA!</h1>
    <div class="subtitulo" id="texto-ganador">Cargando resultado...</div>
    
    <div class="recompensa-box" id="texto-recompensa">Calculando recompensas...</div>

    <div class="contenedor-imagen">
        <img id="img-ganador" src="" alt="Faccion Ganadora">
    </div>

    <div class="botones">
        <a href="index.html" class="btn btn-menu">Volver al Menú Principal</a>
    </div>

    <script>
        window.onload = async function() {
            // 1. CAPTURA INMEDIATA (Antes de cualquier proceso asíncrono o borrado)
            const datosGuardados = localStorage.getItem('resultadoPartida');
            const modoJuego = localStorage.getItem('modoJuego') || '1vs1';
            const miRolLocal = parseInt(localStorage.getItem('legado_rol_navegador') || '1');

            let ganadorPartida = 1; 
            let soyElGanador = false;
            let imgGanador = '';

            // 2. PARSEO SEGURO DE DATOS
            if (datosGuardados) {
                try {
                    const datosPartida = JSON.parse(datosGuardados);
                    ganadorPartida = datosPartida.ganador || 1;
                    imgGanador = datosPartida.imgGanador || '';
                } catch (e) {
                    console.error("Error parseando el resultado de la partida:", e);
                }
            }

            // 3. ACTUALIZACIÓN VISUAL (Síncrona y rápida usando los datos ya capturados)
            if (modoJuego === 'online') {
                soyElGanador = (ganadorPartida === miRolLocal);

                if (soyElGanador) {
                    document.getElementById('texto-ganador').innerText = "¡VICTORIA! HAS DOMINADO EL CAMPO DE BATALLA";
                    document.getElementById('texto-ganador').style.color = "#2ecc71"; // Verde
                } else {
                    document.getElementById('texto-ganador').innerText = "DERROTA. TUS TROPAS HAN CAÍDO";
                    document.getElementById('texto-ganador').style.color = "#e74c3c"; // Rojo
                }
            } else if (modoJuego === 'cpu' || modoJuego === '1vs1' || modoJuego === 'historia') {
                document.getElementById('texto-ganador').innerText = `¡EL JUGADOR ${ganadorPartida} HA DOMINADO EL CAMPO DE BATALLA!`;
                document.getElementById('texto-ganador').style.color = "#f39c12"; // Naranja default
            } else {
                document.getElementById('texto-ganador').innerText = "Partida finalizada.";
            }
            
            if (imgGanador) {
                let rutaCorregida = imgGanador.replace('.PNG', '.png');
                document.getElementById('img-ganador').src = rutaCorregida;
            }

// 4. PROCESO DE BASE DE DATOS Y RECOMPENSAS
try {
    if (window.clienteSupabase) {
        const { data: { session } } = await window.clienteSupabase.auth.getSession();
        
        if (session) {
            const { data: perfil } = await window.clienteSupabase
                .from('perfiles')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (perfil) {
                let monedasActuales = perfil.monedas || 0;
                let eloActual = perfil.elo || 1000;
                let mensajeRecompensa = "";
                let datosUpdate = { monedas: monedasActuales };

                if (modoJuego === 'online') {
                    if (soyElGanador) {
                        monedasActuales += 25;
                        eloActual += 20;
                        mensajeRecompensa = "🌐 ¡Victoria Online! +25 🪙 y +20 🏆 ELO";
                    } else {
                        monedasActuales += 5;
                        eloActual = Math.max(0, eloActual - 20);
                        mensajeRecompensa = "🌐 Derrota Online. +5 🪙 de consolación y -20 🏆 ELO";
                    }
                    datosUpdate.elo = eloActual;
                } 
                else if (modoJuego === 'cpu') {
                    if (ganadorPartida === 1) {
                        monedasActuales += 5;
                        mensajeRecompensa = "🪙 ¡Victoria en Entrenamiento! Has ganado +5 monedas.";
                    } else {
                        mensajeRecompensa = "🤖 Derrota ante la CPU. ¡A seguir practicando!";
                    }
                } 
                else if (modoJuego === 'historia') {
                    monedasActuales += 10;
                    mensajeRecompensa = "📖 ¡Nivel del Modo Historia superado! +10 🪙";
                } 
                else {
                    mensajeRecompensa = "⚔️ Partida Local 1vs1 finalizada.";
                }

                datosUpdate.monedas = monedasActuales;

                // 4.1 Actualizamos Perfil (Monedas y ELO)
                await window.clienteSupabase
                    .from('perfiles')
                    .update(datosUpdate)
                    .eq('id', session.user.id);
                
                // 4.2 ¡NUEVO! Guardamos el registro en historial_partidas
                // Aseguramos que tenemos los datos de la partida parseados
                let faccion1 = 'Desconocida';
                let faccion2 = 'Desconocida';
                if (datosGuardados) {
                    const datos = JSON.parse(datosGuardados);
                    faccion1 = datos.j1 || 'Desconocida';
                    faccion2 = datos.j2 || 'Desconocida';
                }

                // Determinamos el nombre del rival según el modo
                let nombreRival = modoJuego === 'cpu' ? 'CPU' : 'Rival / Invitado';

                await window.clienteSupabase
                    .from('historial_partidas')
                    .insert([{
                        // id y fecha no se mandan porque Supabase los genera automáticamente (uuid y timestamptz)
                        jugador1_nombre: perfil.nombre || session.user.email, // Usa el nombre del perfil o el email
                        faccion_j1: faccion1,
                        jugador2_nombre: nombreRival, 
                        faccion_j2: faccion2,
                        ganador: ganadorPartida, // Mandamos el int4 (1 o 2)
                        modo_juego: modoJuego
                    }]);

                document.getElementById('texto-recompensa').innerText = mensajeRecompensa;
            }
        } else {
            document.getElementById('texto-recompensa').innerText = "Inicia sesión en el menú para registrar recompensas y estadísticas.";
        }
    } else {
        document.getElementById('texto-recompensa').innerText = "Modo sin conexión detectado.";
    }
} catch (err) {
    console.error("Error al actualizar recompensas o historial:", err);
    document.getElementById('texto-recompensa').innerText = "Partida finalizada. Recompensas locales.";
} finally {
    // 5. LIMPIEZA FINAL 
    localStorage.removeItem('resultadoPartida');
    localStorage.removeItem('modoJuego');
    localStorage.removeItem('configuracionOnline');
    localStorage.removeItem('legado_rol_navegador');
}
    </script>
</body>
</html>
